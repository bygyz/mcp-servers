[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trianova-mcp-glpi"
version = "0.1.0"
description = "MCP server for GLPI ITSM/CMDB — AI-ready helpdesk and asset management tools for IT ops agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "glpi", "itsm", "cmdb", "aiops", "trianova"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Systems Administration",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
trianova-mcp-glpi = "trianova_mcp_glpi.server:main"

[project.urls]
Homepage = "https://github.com/trianova/mcp-servers"
Repository = "https://github.com/trianova/mcp-servers"
"Bug Tracker" = "https://github.com/trianova/mcp-servers/issues"
